name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Format, vet, race tests and coverage
        run: make check
      - name: List named tests
        run: go test -list '^Test' ./...
      - name: Build runnable bot
        run: |
          CGO_ENABLED=1 go build -o /tmp/hoarder ./cmd/hoarder
          /tmp/hoarder -h
      - name: Reproducible offline scenario
        run: go run ./cmd/hoarder-sim > /tmp/hoarder-simulation.json
      - name: Seeded faults must fail their named regression tests
        run: make mutation
