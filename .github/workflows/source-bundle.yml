name: Reproducible source bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-bundle.yml'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'

permissions:
  contents: read

concurrency:
  group: source-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Assemble tracked sources and verified offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          go mod vendor
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          tar -czf "$RUNNER_TEMP/hoarder-source.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum hoarder-source.tar.gz > hoarder-source.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoarder-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hoarder-source.tar.gz
            ${{ runner.temp }}/hoarder-source.sha256
          retention-days: 1
          if-no-files-found: error
